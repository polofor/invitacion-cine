<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitación para Achulita ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffb6c1,#ffe4e1);
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.contenedor{
    text-align:center;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 0 25px rgba(0,0,0,.2);
    max-width:500px;
}

h1{
    color:#ff4f81;
}

p{
    font-size:20px;
    color:#444;
}

button{
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:18px;
}

.si{
    background:#4CAF50;
    color:white;
}

.no{
    background:#ff4f4f;
    color:white;
    position:absolute;
}

.oculto{
    display:none;
}

.corazon{
    position:absolute;
    color:red;
    animation:subir 4s linear infinite;
}

@keyframes subir{
    from{
        transform:translateY(0);
        opacity:1;
    }
    to{
        transform:translateY(-100vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="contenedor">
    <h1>💖 Para Achulita 💖</h1>

    <p>
        Hola Achulita 😊<br><br>
        Quería preguntarte algo...
    </p>

    <h2>¿Te gustaría ir al cine conmigo? 🍿🎬</h2>

    <p>
        Podemos ver <b>Toy Story</b> 🧸 o una película de <b>Michael Jackson</b> 🎤✨
    </p>

    <button class="si" onclick="aceptar()">¡Sí! ❤️</button>
    <button class="no" id="no">No 😢</button>

    <div id="respuesta" class="oculto">
        <h2 style="color:#ff4f81">
            ¡Sabía que dirías que sí! 🥰
        </h2>
        <p>
            Entonces preparemos los pochoclos 🍿 y disfrutemos una gran película juntos ❤️
        </p>
    </div>
</div>

<script>
const botonNo = document.getElementById("no");

botonNo.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);

    botonNo.style.left = x + "px";
    botonNo.style.top = y + "px";
});

function aceptar(){
    document.getElementById("respuesta").classList.remove("oculto");

    for(let i=0;i<50;i++){
        let corazon = document.createElement("div");
        corazon.innerHTML = "❤️";
        corazon.className = "corazon";
        corazon.style.left = Math.random()*100 + "vw";
        corazon.style.fontSize = (Math.random()*25+20) + "px";
        document.body.appendChild(corazon);

        setTimeout(() => {
            corazon.remove();
        }, 4000);
    }
}
</script>

</body>
</html>
